<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kardex de Almacén</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#1c1e21;--muted:#6b7280;--border:#333;
  --amarillo:#FFFF00;--verde:#92D050;--accent:#2563eb;--accent-d:#1d4ed8;--danger:#dc2626;
  --pfs:6px;--pcolw:46px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171b;--card:#1e2126;--text:#e8e9ec;--muted:#9aa0a8;}}
:root[data-theme="dark"]{--bg:#15171b;--card:#1e2126;--text:#e8e9ec;--muted:#9aa0a8;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Comic Sans MS","Comic Sans",Arial,sans-serif;}
header{position:sticky;top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid #ccc;z-index:10;}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 40px;}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-bottom:12px;}
h1{font-size:19px;margin:0;text-align:center;}
.sub{color:var(--muted);font-size:12px;margin-top:2px;text-align:center;}
.btn{border:none;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer;background:var(--accent);color:#fff;}
.btn:hover{background:var(--accent-d);}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:4px 8px;font-size:11px;}
.btn.danger:hover{background:var(--danger);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.productos-bar{background:var(--verde);color:#000;font-weight:bold;text-align:center;padding:6px;border:1px solid var(--border);margin-top:10px;}
.section{background:var(--card);border:1px solid #999;margin-top:16px;}
.section-tools{display:flex;justify-content:flex-end;padding:4px 8px;gap:6px;}
.overflow-x{overflow-x:auto;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th,td{border:1px solid var(--border);padding:5px 4px;font-size:12px;text-align:center;}
col.prodcol{width:180px;}
col.datacol{width:64px;}
th.cat{background:var(--amarillo);color:#000;font-weight:bold;text-align:left;padding-left:8px;}
th.stockh{background:var(--amarillo);color:#000;font-weight:bold;}
th.ingh,th.salh{background:var(--verde);color:#000;font-weight:bold;}
td.prod{text-align:left;}
td.stockcell{font-weight:bold;background:#fffde7;}
:root[data-theme="dark"] td.stockcell{background:#3a3a1a;color:#fff;}
input.num{width:100%;padding:3px;border:1px solid #bbb;border-radius:4px;background:var(--card);color:var(--text);text-align:center;font-size:12px;}
.addrow td{text-align:left;}
.addrow input[type=text]{width:60%;padding:6px 8px;border-radius:6px;border:1px solid #bbb;background:var(--card);color:var(--text);}
.meta{font-size:11px;color:var(--muted);padding:6px 10px;text-align:center;}
select{padding:6px 9px;border-radius:7px;border:1px solid #bbb;background:var(--card);color:var(--text);}
.vprint-only{display:none;}
.vgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;box-sizing:border-box;}
.vcard{border:1px solid #000;padding:4px 6px;box-sizing:border-box;overflow:hidden;}
.vtitle{font-weight:bold;font-size:calc(var(--vfs,10px) + 1px);margin-bottom:2px;display:flex;justify-content:space-between;flex-wrap:wrap;}
.vfecha{font-weight:normal;}
.vcols2{display:flex;gap:6px;}
.vcol{flex:1;min-width:0;}
.vsec{margin-bottom:2px;}
.vsechead{background:var(--amarillo);font-weight:bold;font-size:var(--vfs,10px);padding:1px 3px;text-align:center;line-height:1.2;}
.vrow{display:flex;justify-content:space-between;font-size:var(--vfs,10px);padding:0 2px;border-bottom:1px dotted #999;line-height:1.2;white-space:nowrap;overflow:hidden;}
@media print{
  .vprint-only{display:block;page-break-before:always;}
  .vsechead{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.print-almacen #vitrinaPrintBlock{display:none!important;}
  body.print-vitrina #almacenPrintBlock{display:none!important;}
  body.print-vitrina .vprint-only{page-break-before:auto;}
}
@media print{
  @page{size:A4 landscape;margin:8mm;}
  body{background:#fff;color:#000;font-size:var(--pfs);}
  header,.no-print{display:none!important;}
  .wrap{max-width:none;padding:0;}
  .productos-bar{padding:1px;font-size:calc(var(--pfs) + 2px);margin-top:0;}
  .section{border:none;margin:0;}
  tr{page-break-inside:avoid;}
  thead{display:table-header-group;}
  th,td{border:1px solid #000;color:#000;padding:0px 2px!important;font-size:var(--pfs)!important;line-height:1.05;}
  col.datacol{width:var(--pcolw)!important;}
  col.prodcol{width:calc(var(--pcolw) * 2.4)!important;}
  input.num{border:none;background:transparent;color:#000;font-weight:inherit;text-align:center;}
  td.stockcell{background:#fffde7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  th.cat,th.stockh{background:#FFFF00!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  th.ingh,th.salh{background:#92D050!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
<style id="dynPage">@page{size:A4 landscape;margin:8mm;}</style>
</head>
<body>
<header><div class="wrap topbar" style="display:block;">
  <h1>📦 CARDEX ALMACEN 2026</h1>
  <div class="sub" id="lastInfo">—</div>
  <div class="tools no-print" style="margin-top:10px;">
    <button class="btn secondary" id="btnDia" onclick="agregarDia()">+ Agregar día</button>
    <button class="btn secondary" onclick="quitarDia()">Quitar último día</button>
    <button class="btn secondary" onclick="cerrarKardex()">Cerrar e iniciar nuevo</button>
    <button class="btn" onclick="window.print()">🖨️ Imprimir</button>
  </div>
  <div class="tools no-print" style="margin-top:8px;">
    <label class="sub">Imprimir <select id="printTarget" onchange="setPrintTarget(this.value)">
      <option value="ambos">Ambos</option>
      <option value="almacen">Solo Kardex de Almacén</option>
      <option value="vitrina">Solo Control de Vitrina</option>
    </select></label>
  </div>
  <div class="tools no-print" style="margin-top:8px;">
    <label class="sub">Letra impresión <input type="range" id="rngFont" min="4" max="10" step="0.5" oninput="setPref('pfs',this.value)"></label>
    <label class="sub">Tamaño de celda <input type="range" id="rngCell" min="32" max="70" step="1" oninput="setPref('pcolw',this.value)"></label>
  </div>
</div></header>

<div class="wrap">
  <div id="almacenPrintBlock">
    <div class="productos-bar">PRODUCTOS</div>
    <div id="sections"></div>
  </div>
  <div class="no-print" style="margin-top:16px;text-align:center;">
    <button class="btn secondary" onclick="addSection()">+ Agregar sección</button>
    <button class="btn danger" style="margin-left:8px" onclick="resetAll()">Restablecer todo</button>
  </div>

  <div id="vitrinaPrintBlock">
    <h1 class="no-print" style="margin-top:34px;">🧃 CONTROL DIARIO DE VITRINA</h1>
    <div class="sub no-print">Se imprime como 4 plantillas por hoja, para llenar a mano</div>
    <div class="productos-bar no-print">VITRINA · BEBIDAS · ASEOS PERSONALES</div>
    <div id="vprint" class="vprint-only"></div>
  </div>
  <div id="vsections" class="no-print"></div>
  <div class="no-print" style="margin-top:10px;text-align:center;">
    <button class="btn secondary" onclick="vAddSection()">+ Agregar sección</button>
    <button class="btn danger" style="margin-left:8px" onclick="vResetAll()">Restablecer vitrina</button>
  </div>
</div>

<script>
const DEFAULTS = {
  sections: [
    {name:"BEBIDAS", products:["AGUA 2.5 Lt","AGUA PERSONAL C/GAS","AGUA PERSONAL S/GAS","COCA COLA 1.5 Lt","COCA COLA 2.5 Lt","COCA COLA 600ml","CORONA","GUARANA","INKA KOLA 1.5Lt","INKA KOLA 2.5Lt","INKA KOLA 600ml","MALTIN POWER","PILSEN LATA","SAN JUAN LATA","CUSQUEÑA LATA"]},
    {name:"LIMPIEZA", products:["AMBIENTADOR DKASA","AMBIENTADOR SPRAY","BAYGON","BOLSA DE BASURA GR. 26X40","BOLSA DE BASURA PEQ. 20x30","CORTINA DE BAÑO","CLOROX EN POLVO","DETERGENTE","ESPONJA LIMPIEZA","ESPONJA BRILLADOR","ESPONJA LAVAPLATOS","GUANTES LIMPIEZA","JABONCITOS","LAVA VAJILLA","LEJIA","LIMPIA SARRO","PAÑOS AMARILLOS","PAPEL HIGIENICO","ESCOBAS","ESPIRAL TOKAI","SUAVITEL","TOKAI","TRAPEADORES"]},
    {name:"VÍVERES", products:["ACEITE","ACEITE DE COCO","AGUARDIENTE","AJINOMOTO","AJONJOLI","ALGARROBINA","ARROZ","AZUCAR RUBIA","BOLSAS 4X8","BOLSAS 10X15","BOLSAS 16X19","BOLSAS 5X32","BOLSAS 6X12","BOLSAS 8X12","CANELA","CABELLO DE ANGEL","CAFÉ DON CAFÉ","CAFÉ OROVERDE","CEREAL TRIGO","CHAMPIÑONES","CHUÑO","CREMA DE COCO","CREMA DE LECHE","ESCENCIA DE VAINILLA","FIDEO TORNILLO","FIDEO SPAGUETTI","FILETE","HARINA","HUEVOS","JARABE DE GOMA","JIGGER MENTA","JUGO DURAZNO 1 LT","KETCHUP","LECHE CONDENSADA","LECHE IDEAL","MAGGI CARNE","MAGGI GALLINA","MAGGI PESCADO","MAIZ CANCHA","MANJAR","MANTEQUILLA","MAYONESA","MERMELADA","MIEL","MOSTAZA","OSTION","PAPAS AL HILO","PAPEL TOALLA","PASTA DE TOMATE","QUESO PARMESANO","SAL","SALSA TAMARINDO","SERVILLETA CORTADA","SILLAO","TÉ ANIS","TÉ CANELA Y CLAVO","TÉ MANZANILLA","TÉ PURO","VINAGRE BLANCO","VINAGRE ROJO","RON","PISCO","VINO","VINO BLANCO"]},
    {name:"OTROS", products:["ALCOHOL","CANASTITA CARTON","CARTILLA","COMANDA","FOCOS","FOSFORO","GUANTES COCINA L","GUANTES COCINA S","HAMACAS","PALITOS BROCHETAS","SORBETE","TAPERS DESCARTABLES","TOCAS","VASOS DESCARTABLES","COMIDA DE GATO","CROQUETAS GAVIOTA","PATE BRUNA","PATE GAVIOTA","ARENA DE GATO","PLUMERO","SULFATO DE ALUMINIO","SODA CAUSTICA","CLORO PISCINA","PILA AA","PILA AAA","PILA THERMA","BORRADOR","RESALTADOR","LAPICEROS","SOQUET","MICAS","MONDADIENTES","TIQUETERA","TIJERAS","MANGO/ ESCOBA","TACHO","BOYA DE ACCESO","PERNOS","PARACETAMOL","TAPAS","PINES DE DUCHA"]}
  ]
};
const MAX_DIAS = 4;
const KEY = "kardexAlmacen_v2";
let uidc = 1;
const uid = ()=> "id"+(uidc++)+"_"+Math.random().toString(36).slice(2,7);

const VDEFAULTS = {
  sections: [
    {name:"VITRINA", products:["Marshmellows","Gomitas","Pinguino","Wafer","Chocman Azul","Chocman Blanco","Trikis","Salticas","Trident","Invite","Reyenito","Mentas","Margarita","Morochas","Rellenitas","Soda V","Keke"]},
    {name:"BEBIDAS", products:["Coca p.","Inca p.","Guarana","Guaranita","Maltin","Corona","San Juan","Pilsen lata","Trigo lata","Agua S/G","Agua C/G","Jugos"]},
    {name:"ASEOS PERSONALES", products:["Cepillo","Pasta dental","H & S","Pantene","Jabon","Afeitador","Desodorante","Bloqueador","Repelente","Peine","Encendedor"]}
  ]
};
const VKEY = "kardexVitrina_v1";
function vBuildDefault(){
  return { sections: VDEFAULTS.sections.map(s=>({id:uid(), name:s.name, products:s.products.map(p=>({id:uid(), name:p}))})) };
}
function vLoad(){
  try{ const raw = localStorage.getItem(VKEY); if(raw){ const p=JSON.parse(raw); if(p.sections) return p; } }catch(e){}
  return vBuildDefault();
}
function vSave(){ try{ localStorage.setItem(VKEY, JSON.stringify(vdata)); }catch(e){} }
let vdata = vLoad();

function vRenderEdit(){
  const el = document.getElementById("vsections");
  el.innerHTML = vdata.sections.map(sec=>`
    <div class="section" style="margin-top:12px;">
      <div class="section-tools"><button class="btn danger" onclick="vDeleteSection('${sec.id}')">Eliminar sección</button></div>
      <table><colgroup><col class="prodcol"><col></colgroup>
      <thead><tr><th class="cat" colspan="2">${sec.name}</th></tr></thead>
      <tbody>
      ${sec.products.map(p=>`<tr><td class="prod">${p.name}</td><td style="width:60px;"><button class="btn danger" onclick="vDeleteProduct('${sec.id}','${p.id}')">✕</button></td></tr>`).join("")}
      <tr><td colspan="2"><input type="text" id="vnp_${sec.id}" placeholder="Nuevo producto...">
        <button class="btn" onclick="vAddProduct('${sec.id}')">+ Agregar producto</button></td></tr>
      </tbody></table>
    </div>`).join("");
  vRenderPrint();
}
function splitSections(sections){
  const withLines = sections.map(s=>({id:s.id, name:s.name, products:s.products, lines:1+s.products.length}));
  const sorted = [...withLines].sort((a,b)=>b.lines-a.lines);
  let leftLines=0, rightLines=0, left=[], right=[];
  sorted.forEach(s=>{ if(leftLines<=rightLines){ left.push(s); leftLines+=s.lines; } else { right.push(s); rightLines+=s.lines; } });
  const order = sections.map(s=>s.id);
  left.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  right.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  return { left, right, maxLines: Math.max(leftLines,rightLines) };
}
function vColHtml(arr){
  return arr.map(sec=>`<div class="vsec">
    <div class="vsechead">${sec.name}</div>
    ${sec.products.map(p=>`<div class="vrow"><span>${p.name}</span><span>______</span></div>`).join("")}
  </div>`).join("");
}
function vCard(){
  const {left,right} = splitSections(vdata.sections);
  return `<div class="vcard">
    <div class="vtitle">CONTROL DIARIO DE PRODUCTOS <span class="vfecha">FECHA:__________</span></div>
    <div class="vcols2"><div class="vcol">${vColHtml(left)}</div><div class="vcol">${vColHtml(right)}</div></div>
  </div>`;
}
const MM2PX = 96/25.4;
function vitrinaPageDims(){
  const t = (document.getElementById('printTarget')||{}).value || 'ambos';
  if(t==='vitrina') return { w:(210-16)*MM2PX, h:(297-16)*MM2PX }; // vertical
  return { w:(297-16)*MM2PX, h:(210-16)*MM2PX }; // horizontal (comparte hoja con almacén)
}
function autoFitVitrina(){
  const wrap = document.getElementById("vprint");
  const grid = wrap.querySelector(".vgrid");
  if(!grid) return;
  const {w:pw, h:ph} = vitrinaPageDims();
  const targetH = ph*0.98; // margen de seguridad para que nunca desborde a una 2da hoja
  const GAP=8, PAD_BORDER=10;
  const cardH = (ph-GAP)/2;
  const {maxLines} = splitSections(vdata.sections);
  const ROW_FACTOR = 1.3, TITLE_LINES = 1.4;
  let fs = (cardH-PAD_BORDER)/((maxLines+TITLE_LINES)*ROW_FACTOR);
  fs = Math.max(4, Math.min(30, fs));
  document.documentElement.style.setProperty('--vfs', fs+'px');
  const prevCss = wrap.getAttribute("style")||"";
  wrap.style.cssText = "position:fixed;left:-99999px;top:0;display:block;width:"+pw+"px;";
  for(let i=0;i<6;i++){
    const measured = grid.scrollHeight;
    if(measured<=0) break;
    const scale = targetH/measured;
    if(scale>=1 && scale<1.03) break;
    fs = Math.max(4, Math.min(30, fs*scale));
    document.documentElement.style.setProperty('--vfs', fs+'px');
  }
  wrap.setAttribute("style", prevCss);
}
function setPageOrientation(v){
  const orientation = v==='vitrina' ? 'portrait' : 'landscape';
  document.getElementById('dynPage').textContent = '@page{size:A4 '+orientation+';margin:8mm;}';
}
function setPrintTarget(v){
  document.body.classList.remove('print-almacen','print-vitrina');
  if(v==='almacen') document.body.classList.add('print-almacen');
  else if(v==='vitrina') document.body.classList.add('print-vitrina');
  try{ localStorage.setItem('kardexPrintTarget', v); }catch(e){}
  setPageOrientation(v);
  autoFitVitrina();
}
function loadPrintTarget(){
  let v='ambos';
  try{ v = localStorage.getItem('kardexPrintTarget') || 'ambos'; }catch(e){}
  document.getElementById('printTarget').value = v;
  setPrintTarget(v);
}
function vRenderPrint(){
  document.getElementById("vprint").innerHTML = `<div class="vgrid">${vCard()}${vCard()}${vCard()}${vCard()}</div>`;
  autoFitVitrina();
}
function vAddProduct(secId){
  const inp = document.getElementById("vnp_"+secId); const name = inp.value.trim(); if(!name) return;
  const sec = vdata.sections.find(s=>s.id===secId); sec.products.push({id:uid(), name});
  vSave(); vRenderEdit();
}
function vDeleteProduct(secId,prodId){
  const sec = vdata.sections.find(s=>s.id===secId); sec.products = sec.products.filter(p=>p.id!==prodId);
  vSave(); vRenderEdit();
}
function vAddSection(){
  const name = prompt("Nombre de la nueva sección:"); if(!name) return;
  vdata.sections.push({id:uid(), name:name.trim().toUpperCase(), products:[]}); vSave(); vRenderEdit();
}
function vDeleteSection(secId){
  if(!confirm("¿Eliminar esta sección y todos sus productos?")) return;
  vdata.sections = vdata.sections.filter(s=>s.id!==secId); vSave(); vRenderEdit();
}
function vResetAll(){
  if(!confirm("Esto borra todo y vuelve a la lista original de la vitrina. ¿Continuar?")) return;
  vdata = vBuildDefault(); vSave(); vRenderEdit();
}

function buildDefault(){
  return {
    numDias:0, lastCierre:null,
    sections: DEFAULTS.sections.map(s=>({
      id: uid(), name: s.name,
      products: s.products.map(p=>({id:uid(), name:p, stockInicial:0, dias:[]}))
    }))
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return buildDefault();
    const parsed = JSON.parse(raw);
    if(!parsed.sections) return buildDefault();
    if(typeof parsed.numDias!=="number") parsed.numDias=0;
    return parsed;
  }catch(e){ return buildDefault(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ console.error(e); } }
let data = load();
const n = v => isFinite(v)? v : 0;

const PKEY = "kardexPrintPrefs_v1";
function loadPrefs(){
  try{ const raw = localStorage.getItem(PKEY); if(raw){ const p=JSON.parse(raw); if(p.pfs&&p.pcolw) return p; } }catch(e){}
  return {pfs:6, pcolw:46};
}
let prefs = loadPrefs();
function applyPrefs(){
  document.documentElement.style.setProperty('--pfs', prefs.pfs+'px');
  document.documentElement.style.setProperty('--pcolw', prefs.pcolw+'px');
  document.getElementById('rngFont').value = prefs.pfs;
  document.getElementById('rngCell').value = prefs.pcolw;
}
function setPref(key,val){
  prefs[key] = Number(val);
  try{ localStorage.setItem(PKEY, JSON.stringify(prefs)); }catch(e){}
  applyPrefs();
}

function stockEnDia(p, idx){
  let s = n(p.stockInicial);
  for(let i=0;i<=idx;i++){ s += n(p.dias[i].ingreso) - n(p.dias[i].salidas); }
  return s;
}
function stockFinal(p){ return p.dias.length? stockEnDia(p,p.dias.length-1) : n(p.stockInicial); }

function headerRow(sec){
  let h = `<th class="prodcol" style="background:${'var(--verde)'}">${sec.name}</th><th class="stockh">STOCK=</th>`;
  for(let i=0;i<data.numDias;i++){
    h += `<th class="ingh">INGRESO</th><th class="salh">SALIDAS</th><th class="stockh">STOCK=</th>`;
  }
  return `<tr>${h}</tr>`;
}
function colgroup(){
  let c = `<col class="prodcol"><col class="datacol">`;
  for(let i=0;i<data.numDias;i++) c += `<col class="datacol"><col class="datacol"><col class="datacol">`;
  return `<colgroup>${c}</colgroup>`;
}
function blank(v){ return v? v : ''; }
function productRow(sec,p){
  let cells = `<td class="prod">${p.name}</td><td class="stockcell">${blank(n(p.stockInicial))}</td>`;
  for(let i=0;i<data.numDias;i++){
    const d = p.dias[i] || {ingreso:0,salidas:0};
    cells += `<td><input class="num" type="number" value="${blank(n(d.ingreso))}" oninput="upd('${sec.id}','${p.id}',${i},'ingreso',this.value)"></td>
      <td><input class="num" type="number" value="${blank(n(d.salidas))}" oninput="upd('${sec.id}','${p.id}',${i},'salidas',this.value)"></td>
      <td class="stockcell">${blank(stockEnDia(p,i))}</td>`;
  }
  return `<tr><td class="no-print" style="width:26px;border:none;"><button class="btn danger" onclick="deleteProduct('${sec.id}','${p.id}')">✕</button></td>${cells}</tr>`;
}
function render(){
  const el = document.getElementById("sections");
  el.innerHTML = "";
  document.getElementById("btnDia").disabled = data.numDias>=MAX_DIAS;
  data.sections.forEach(sec=>{
    const div = document.createElement("div");
    div.className = "section";
    const rows = sec.products.map(p=>productRow(sec,p)).join("");
    div.innerHTML = `
      <div class="section-tools no-print">
        <button class="btn danger" onclick="deleteSection('${sec.id}')">Eliminar sección</button>
      </div>
      <div class="overflow-x"><table>
        ${colgroup()}
        <thead>${headerRow(sec)}</thead>
        <tbody>${rows}
          <tr class="addrow no-print"><td colspan="${2+data.numDias*3}">
            <input type="text" id="np_${sec.id}" placeholder="Nuevo producto...">
            <button class="btn" onclick="addProduct('${sec.id}')">+ Agregar producto</button>
          </td></tr>
        </tbody>
      </table></div>`;
    el.appendChild(div);
  });
  document.getElementById("lastInfo").textContent = data.lastCierre
    ? "Kardex vigente desde: " + new Date(data.lastCierre).toLocaleString("es-PE")
    : "Kardex inicial — aún no se ha cerrado ningún ciclo";
}
function upd(secId,prodId,idx,field,val){
  const sec = data.sections.find(s=>s.id===secId); const p = sec.products.find(p=>p.id===prodId);
  if(!p.dias[idx]) p.dias[idx] = {ingreso:0,salidas:0};
  p.dias[idx][field] = val===""?0:Number(val);
  save(); render();
}
function agregarDia(){
  if(data.numDias>=MAX_DIAS) return;
  data.numDias++;
  data.sections.forEach(sec=>sec.products.forEach(p=>{ while(p.dias.length<data.numDias) p.dias.push({ingreso:0,salidas:0}); }));
  save(); render();
}
function quitarDia(){
  if(data.numDias<=0) return;
  if(!confirm("¿Quitar el último día registrado?")) return;
  data.numDias--;
  data.sections.forEach(sec=>sec.products.forEach(p=>{ p.dias = p.dias.slice(0,data.numDias); }));
  save(); render();
}
function cerrarKardex(){
  if(!confirm("Esto guarda el stock final como nuevo stock inicial y empieza un kardex en blanco (como imprimir una hoja nueva). ¿Continuar?")) return;
  data.sections.forEach(sec=>sec.products.forEach(p=>{ p.stockInicial = stockFinal(p); p.dias = []; }));
  data.numDias = 0; data.lastCierre = new Date().toISOString();
  save(); render();
}
function addProduct(secId){
  const inp = document.getElementById("np_"+secId); const name = inp.value.trim(); if(!name) return;
  const sec = data.sections.find(s=>s.id===secId);
  sec.products.push({id:uid(), name, stockInicial:0, dias:Array.from({length:data.numDias},()=>({ingreso:0,salidas:0}))});
  save(); render();
}
function deleteProduct(secId,prodId){
  const sec = data.sections.find(s=>s.id===secId); sec.products = sec.products.filter(p=>p.id!==prodId); save(); render();
}
function addSection(){
  const name = prompt("Nombre de la nueva sección:"); if(!name) return;
  data.sections.push({id:uid(), name:name.trim().toUpperCase(), products:[]}); save(); render();
}
function deleteSection(secId){
  if(!confirm("¿Eliminar esta sección y todos sus productos?")) return;
  data.sections = data.sections.filter(s=>s.id!==secId); save(); render();
}
function resetAll(){
  if(!confirm("Esto borra todo y vuelve a la lista original. ¿Continuar?")) return;
  data = buildDefault(); save(); render();
}
applyPrefs();
loadPrintTarget();
render();
vRenderEdit();
</script>
</body>
</html>
